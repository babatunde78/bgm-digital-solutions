<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Payment verification | BGM Digital Solutions</title><link rel="stylesheet" href="styles.css"></head><body><main class="section"><div class="container"><div class="card"><div class="card-body"><h1>Verifying your payment</h1><p id="message">Please wait while we securely confirm the transaction.</p><p><a class="btn" href="/">Return to store</a></p></div></div></div></main><script>const p=new URLSearchParams(location.search),r=p.get('reference')||p.get('trxref');const m=document.getElementById('message');if(!r){m.textContent='No transaction reference was supplied.'}else{fetch('/api/verify-payment?reference='+encodeURIComponent(r)).then(async x=>({ok:x.ok,data:await x.json()})).then(({ok,data})=>{m.textContent=ok&&data.verified?'Payment confirmed for '+data.product.name+'. A secure delivery process can now be completed.':(data.error||'Payment has not been verified.');}).catch(()=>m.textContent='We could not verify the payment right now. Please contact support with your transaction reference.');}</script></body></html>
